services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eduzan
      POSTGRES_PASSWORD: change-me-local-only
      POSTGRES_DB: eduzan
    ports:
      - "5432:5432"
    volumes:
      - eduzan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduzan -d eduzan"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  eduzan_pgdata:
